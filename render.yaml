services:
  - type: web
    name: whatsapp-bot
    env: node
    buildCommand: PUPPETEER_CACHE_DIR=/opt/render/project/src/.cache/puppeteer npx puppeteer browsers install chrome && npm install
    startCommand: node bot.js
    envVars:
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
